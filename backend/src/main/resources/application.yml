server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${RECEIPT_SECURE_COOKIE:false}
      timeout: 12h
  tomcat:
    max-swallow-size: 10MB
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
receipt-share:
  data-dir: ${RECEIPT_DATA_DIR:./data}
  tesseract: ${TESSERACT_COMMAND:tesseract}
